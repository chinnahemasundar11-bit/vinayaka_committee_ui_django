{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Vinayaka Youth Committee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="brand-icon"><i class="bi bi-key-fill"></i></div>
            <h1 class="auth-title">Reset Password</h1>
            <span class="auth-subtitle">Enter registered mobile number for OTP reset.</span>
        </div>
        <form action="/accounts/login/">
            <div class="mb-4">
                <label class="form-label">Mobile Number</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-phone"></i></span>
                    <input class="form-control" type="tel" placeholder="10-digit registered mobile number" required>
                </div>
            </div>
            <button class="btn btn-primary w-100 py-2.5" type="submit">
                <span>Send OTP / Reset Link</span>
                <i class="bi bi-send"></i>
            </button>
            <div class="text-center mt-4 pt-2 border-top">
                <a href="/accounts/login/" class="small text-danger text-decoration-none fw-bold"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
            </div>
        </form>
    </div>
</body>
</html>
