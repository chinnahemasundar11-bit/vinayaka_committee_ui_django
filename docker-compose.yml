version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vinayaka_postgres_db
    environment:
      POSTGRES_DB: festival_db
      POSTGRES_USER: festival_user
      POSTGRES_PASSWORD: festival_password
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    restart: always

  web:
    build: .
    container_name: vinayaka_django_app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-production-key-change-me-in-env
      - DB_NAME=festival_db
      - DB_USER=festival_user
      - DB_PASSWORD=festival_password
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    ports:
      - "8000:8000"
    restart: always

  nginx:
    image: nginx:1.25-alpine
    container_name: vinayaka_nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
