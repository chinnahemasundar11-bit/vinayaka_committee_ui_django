{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Vinayaka Youth Committee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="brand-icon"><i class="bi bi-person-plus-fill"></i></div>
            <h1 class="auth-title">Create Account</h1>
            <span class="auth-subtitle">Youth Committee Member Registration</span>
        </div>
        <form action="/accounts/login/">
            <div class="mb-3">
                <label class="form-label">Full Name *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input class="form-control" type="text" placeholder="Enter your full name" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Mobile Number *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-phone"></i></span>
                    <input class="form-control" type="tel" placeholder="Enter 10-digit mobile number" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Password *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input class="form-control" type="password" placeholder="Create password" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm Password *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                    <input class="form-control" type="password" placeholder="Confirm password" required>
                </div>
            </div>
            <button class="btn btn-primary w-100 py-2.5 mt-2" type="submit">
                <span>Submit Registration</span>
                <i class="bi bi-check-circle"></i>
            </button>
            <div class="text-center mt-4 pt-2 border-top">
                <span class="small text-muted">Already registered?</span>
                <a href="/accounts/login/" class="small text-danger text-decoration-none fw-bold ms-1">Back to Login</a>
            </div>
        </form>
    </div>
</body>
</html>
